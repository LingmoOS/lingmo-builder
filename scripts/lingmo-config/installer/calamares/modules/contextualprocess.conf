# 注意：此处的目录名是字面量（Calamares 不展开 shell 变量）。
# 若改动 lingmo-builder 里的 LB_LIVE_DIR，这里必须同步改成同一个名字。当前：core.lm
---
dontChroot: true
packagechooser_packagechooser:
    normal:
        - "ln -sf /run/live/medium/core.lm/desktop.squashfs /run/live/medium/core.lm/filesystem.squashfs"
    full:
        - "ln -sf /run/live/medium/core.lm/desktop.squashfs /run/live/medium/core.lm/filesystem.squashfs && touch /tmp/.full-install"

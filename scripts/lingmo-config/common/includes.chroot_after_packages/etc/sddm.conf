[Theme]
Current=lingmo

[Users]
# Default $PATH for logged in users
# Don't change this, See issue in 
# https://github.com/orgs/LingmoOS/discussions/25#discussioncomment-11029445
DefaultPath=/usr/bin:/bin

[General]
Numlock=on
# Lingmo SDDM theme needs both of these: InputMethod selects the virtual
# keyboard, GreeterEnvironment puts the theme's components/ directory (it
# overrides the virtual keyboard style) on the QML import path. Without
# them the greeter cannot load the theme and silently falls back to the
# default one, which looks like "installing the theme did nothing".
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/lingmo/components/,QT_IM_MODULE=qtvirtualkeyboard

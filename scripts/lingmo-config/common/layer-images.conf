# layer-images.conf —— 把根文件系统拆成多个 *.img 层的映射表
#
# 格式（每行三列，`#` 开头为注释）：
#   path  <路径前缀>   <层名>      # 路径前缀规则（优先级最高）
#   pkg   <包名glob>   <层名>      # 包名规则（按文件顺序，第一条命中的生效）
#
# 规则优先级：符号链接 → misc ＞ path 规则 ＞ pkg 规则 ＞ 兜底 system
#
# ★ 层集合与顺序（core.module 里的顺序，越靠后优先级越高）由钩子固定为：
#     system → firmware → kernel → desktop → lingmo → apps → vendor → device → misc
#   钩子**空层也会生成**，所以这里增减层时必须同步改三处：
#     lingmo-builder: 本文件 + 钩子里的 ORDER
#     lingmo-installer-config: calamares/modules/unpackfs.conf 的层列表
#
# 包名家族来自 ISO 的 package-lists（lingmo_default_chroot / standard /
# hardware-support / variant-* 等，共 252 个显式包；依赖包自然落到 system）。

# ── 路径前缀规则 ────────────────────────────────────────────────
path  /vendor           vendor
path  /device           device
path  /boot             kernel
path  /lib/modules      kernel
path  /usr/lib/modules  kernel
path  /usr/src          kernel

# ── 包名规则（自上而下，第一条命中的生效；兜底必须放最后）────────
# 内核与固件
pkg   linux-image-*       kernel
pkg   linux-headers-*     kernel
pkg   linux-modules-*     kernel
pkg   linux-kbuild-*      kernel
pkg   linux-base          kernel
pkg   firmware-*          firmware
pkg   *-firmware          firmware
pkg   *-firmware-*        firmware
pkg   broadcom-sta-dkms   firmware

# 桌面环境（DDE / Deepin 体系 + 显示与输入法栈）
pkg   dde-*               desktop
pkg   deepin-*            desktop
pkg   startdde*           desktop
pkg   dcc*                desktop
pkg   ds-*                desktop
pkg   dde-*-plugin        desktop
pkg   fcitx5*             desktop
pkg   fonts-*             desktop
pkg   xserver-*           desktop
pkg   x11-*               desktop
pkg   mesa-*              desktop
pkg   qml*-*              desktop
pkg   qt*-integration     desktop
pkg   libqt*-*            desktop

# Lingmo 自有组件
pkg   lingmo-*            lingmo
pkg   velora-*            lingmo
pkg   lingmoos-*          lingmo

# 应用（可按需继续加；加完不用改 Calamares，因为层集合是固定的）
pkg   vlc*                apps
pkg   firefox*            apps
pkg   chromium*           apps
pkg   libreoffice*        apps
pkg   thunderbird*        apps
pkg   gimp*               apps
pkg   inkscape*           apps
pkg   mpv*                apps
pkg   smplayer*           apps
pkg   remmina*            apps
pkg   transmission*       apps

# ── 兜底（必须最后一行）────────────────────────────────────────
pkg   *                   system

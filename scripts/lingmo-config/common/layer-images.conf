# layer-images.conf —— 把根文件系统拆成多个 *.img 层的映射表
#
# 格式（每行三列，`#` 开头为注释）：
#   path  <路径前缀>   <层名>      # 路径前缀规则（优先级最高）
#   pkg   <包名glob>   <层名>      # 包名规则（按文件顺序，第一条命中的生效）
#
# 规则优先级（由脚本实现）：
#   1) 符号链接（任何路径）      → misc      ← 固定规则，避免"同路径在一层是目录、另一层是符号链接"
#   2) path 规则（前缀匹配）     → 指定层
#   3) pkg  规则（首个命中）     → 指定层
#   4) 都没命中                 → system    （兜底）
#
# ★ 层序（core.module 里的顺序，越靠后优先级越高）由脚本固定为：
#     system → vendor → device → kernel → boot → misc
#   misc 永远最后 ⇒ 符号链接永远赢

# ── 路径前缀规则 ──────────────────────────────────────────────
path  /oem            oem
path  /vendor         vendor
path  /boot           kernel
path  /lib/modules    kernel
path  /usr/lib/modules kernel

# ── 包名规则（自上而下，第一条命中的生效；兜底放最后）──────────
pkg   linux-image-*     kernel
pkg   linux-headers-*   kernel
pkg   linux-modules-*   kernel
pkg   linux-kbuild-*    kernel
pkg   *                 system

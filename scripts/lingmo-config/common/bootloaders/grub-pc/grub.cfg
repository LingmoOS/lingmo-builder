# Live Image (UEFI boot)
source /boot/grub/config.cfg
loadfont unicode

source /boot/grub/config.cfg
set timeout=5

set gfxmode=auto
insmod all_video
insmod gfxterm
insmod png

set theme=/boot/grub/next/theme.txt

set color_normal=white/black
set color_highlight=black/light-gray

# Live boot
menuentry "Try or Install Lingmo OS" --hotkey=l {
    linux @KERNEL_LIVE@ @APPEND_LIVE@
    initrd @INITRD_LIVE@
}

menuentry "Try or Install Lingmo OS (fail-safe mode)" {
    linux @KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
    initrd @INITRD_LIVE@
}

menuentry "Lingmo OS with USB persistence" {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ persistence
    initrd @INITRD_LIVE@
}

menuentry "Lingmo OS with USB encrypted persistence" {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ persistent=cryptsetup persistence-encryption=luks persistence
    initrd @INITRD_LIVE@
}

